services:
  redis:
    image: redis:7-alpine
  web:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment: &env
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:////data/db.sqlite3
    volumes: [data:/data]
    depends_on: [redis]
  worker:
    build: .
    command: celery -A config worker -l info
    env_file: .env
    environment: *env
    volumes: [data:/data]
    depends_on: [redis]
volumes:
  data:
