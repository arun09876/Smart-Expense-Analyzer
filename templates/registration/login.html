{% extends "base.html" %}
{% block title %}Login · Expense Analyzer{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Welcome back</h1>
        <p class="text-muted">Know where your UPI and card money goes.</p>
        {% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}
        <form method="post">{% csrf_token %}
          <div class="mb-3"><label class="form-label">Username</label>
            <input name="username" class="form-control" required autofocus></div>
          <div class="mb-3"><label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required></div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-dark w-100">Log in</button>
        </form>
        <p class="mt-3 mb-0 text-center">New here? <a href="{% url 'signup' %}">Create an account</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
